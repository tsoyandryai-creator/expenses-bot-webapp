<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Мои финансы</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ЭКРАН: сводка -->
  <section id="screen-dashboard" class="screen">
    <h1 class="brand">Мои финансы</h1>

    <div class="segmented type-toggle" data-role="tx-type">
      <button type="button" data-type="expense">➖ Расходы</button>
      <button type="button" data-type="income">➕ Доход</button>
    </div>

    <div class="segmented" data-role="period">
      <button type="button" data-period="day">День</button>
      <button type="button" data-period="week">Неделя</button>
      <button type="button" data-period="month">Месяц</button>
    </div>

    <div class="hero-stat">
      <div class="label" data-role="hero-label">Потрачено за неделю</div>
      <div class="value" data-role="hero-total">— ₽</div>
    </div>

    <div class="week-bars" data-role="week-bars" hidden></div>

    <div class="receipt">
      <div class="receipt-head"><span data-role="recent-head">Недавние расходы</span><span>сумма</span></div>
      <div data-role="recent-list" class="receipt-body">
        <p class="empty-hint">Загрузка…</p>
      </div>
    </div>

    <button type="button" class="stats-link" data-role="open-stats">📊 Статистика и баланс</button>
  </section>

  <!-- ЭКРАН: добавление -->
  <section id="screen-add" class="screen" hidden>
    <h1 class="screen-title" data-role="add-title">Добавить расход</h1>

    <div class="cat-grid" data-role="category-grid"></div>

    <div class="new-cat-row" data-role="new-cat-row" hidden>
      <input type="text" class="field-input" data-role="new-cat-input" placeholder="Название категории" maxlength="32" />
      <button type="button" class="mini-btn" data-role="new-cat-confirm">Добавить</button>
    </div>

    <div class="amount-field">
      <label class="lbl" for="amount-input" data-role="amount-label">Сумма расхода</label>
      <div class="input-row">
        <input id="amount-input" class="amount-input" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" data-role="amount-input" />
        <span class="cur">₽</span>
      </div>
    </div>

    <input type="text" class="field-input" data-role="comment-input" placeholder="Комментарий (необязательно)" maxlength="200" />

    <p class="form-error" data-role="add-error" hidden></p>
  </section>

  <!-- ЭКРАН: статистика -->
  <section id="screen-stats" class="screen" hidden>
    <h1 class="screen-title">Статистика</h1>

    <div class="segmented type-toggle" data-role="tx-type-stats">
      <button type="button" data-type="expense">➖ Расходы</button>
      <button type="button" data-type="income">➕ Доход</button>
    </div>

    <div class="segmented" data-role="period-stats">
      <button type="button" data-period="day">День</button>
      <button type="button" data-period="week">Неделя</button>
      <button type="button" data-period="month">Месяц</button>
    </div>

    <div class="segmented view-toggle" data-role="view-toggle">
      <button type="button" data-view="list" class="active">☰ Список</button>
      <button type="button" data-view="donut">◔ Диаграмма</button>
    </div>

    <div data-role="stats-list" class="statbar-list"></div>

    <div class="donut-wrap" data-role="stats-donut" hidden>
      <div class="donut" data-role="donut-circle">
        <div class="donut-center">
          <div class="lbl" data-role="donut-period-label">За неделю</div>
          <div class="val" data-role="donut-total">— ₽</div>
        </div>
      </div>
    </div>
    <div class="legend-list" data-role="legend-list" hidden></div>

    <div class="total-line">
      <span class="lbl" data-role="stats-total-label">Итого за неделю</span>
      <span class="val" data-role="stats-total">— ₽</span>
    </div>

    <div class="total-line balance-line" data-role="balance-line">
      <span class="lbl" data-role="balance-label">Баланс за неделю</span>
      <span class="val" data-role="balance-value">— ₽</span>
    </div>
  </section>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
